<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>투약일지 · 사하의집</title>
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --slate:#46587A;
    --slate-dark:#2B3A54;
    --slate-soft:#EEF1F6;
    --coral:#E8785A;
    --coral-soft:#FBE9E3;
    --coral-deep:#C85A3D;
    --amber:#D9A441;
    --amber-soft:#FBF1DD;
    --text:#25303F;
    --muted:#8992A3;
    --border:#E3E7EE;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  button{font-family:inherit; -webkit-tap-highlight-color:transparent;}
  #app{max-width:820px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  .print-only{display:none;}

  /* ---------- 로그인 화면 ---------- */
  .login-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; gap:28px;
  }
  .brand{text-align:center;}
  .brand .mark{
    width:56px; height:56px; border-radius:16px; background:var(--slate);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
    box-shadow:0 8px 20px -8px rgba(43,58,84,.45);
  }
  .brand .mark svg{width:28px; height:28px;}
  .brand h1{font-size:20px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em;}
  .brand p{font-size:13px; color:var(--muted); margin:0;}

  .code-dots{display:flex; gap:12px; justify-content:center; height:16px;}
  .code-dots span{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--border); background:transparent;
    transition:all .15s ease;
  }
  .code-dots span.filled{background:var(--slate); border-color:var(--slate); transform:scale(1.05);}
  .code-dots.err span.filled{background:var(--coral); border-color:var(--coral);}

  .keypad{display:grid; grid-template-columns:repeat(3,72px); gap:14px;}
  .keypad button{
    width:72px; height:72px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); font-size:22px; font-weight:600; color:var(--text);
    box-shadow:0 2px 6px rgba(43,58,84,.06);
  }
  .keypad button:active{background:var(--slate-soft); transform:scale(.96);}
  .keypad button.ghost{border:none; box-shadow:none; background:transparent; color:var(--muted); font-size:14px;}
  .login-msg{font-size:13px; color:var(--coral-deep); min-height:18px; font-weight:600;}

  /* ---------- 상단바 ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:14px 18px;
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .topbar-left{display:flex; flex-direction:column;}
  .topbar-left .facility{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.02em;}
  .topbar-left .who{font-size:15px; font-weight:700; margin-top:1px;}
  .topbar-left .who .role{
    font-size:10px; font-weight:700; color:var(--coral-deep); background:var(--coral-soft);
    padding:2px 6px; border-radius:6px; margin-left:6px; vertical-align:middle;
  }
  .topbar-actions{display:flex; gap:6px;}
  .icon-btn{
    border:none; background:var(--slate-soft); color:var(--slate); font-size:12px; font-weight:600;
    padding:8px 12px; border-radius:10px; white-space:nowrap; cursor:pointer;
  }
  .icon-btn.primary{background:var(--slate); color:#fff;}

  .date-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .date-row input[type=date],.date-row input[type=month]{
    flex:1; border:1px solid var(--border); border-radius:10px; padding:9px 10px;
    font-size:14px; font-family:inherit; color:var(--text); background:var(--bg);
  }
  .date-nav{
    border:1px solid var(--border); background:var(--surface); width:36px; height:36px; border-radius:10px;
    font-size:16px; color:var(--slate); font-weight:700; flex:none;
  }
  .date-nav:active{background:var(--slate-soft);}

  .tabs{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .tab{
    flex:1; min-width:70px; text-align:center; padding:10px 0; border-radius:10px; font-size:13px; font-weight:700;
    background:var(--bg); color:var(--muted); border:1px solid var(--border);
  }
  .tab.active{background:var(--slate); color:#fff; border-color:var(--slate);}

  /* ---------- 본문 ---------- */
  main{flex:1; padding:16px 16px 40px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:40px 20px;}

  .summary-bar{
    display:flex; gap:10px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;
  }
  .summary-chip{
    flex:none; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; min-width:84px; text-align:center;
  }
  .summary-chip .n{font-size:18px; font-weight:800; color:var(--slate-dark); line-height:1;}
  .summary-chip .l{font-size:10px; color:var(--muted); margin-top:4px; font-weight:600;}

  .resident-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .resident-card.away{background:var(--bg);}
  .resident-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .resident-name{font-size:16px; font-weight:800; letter-spacing:-.01em;}
  .away-badge{
    font-size:10px; font-weight:700; color:var(--slate); background:var(--slate-soft);
    padding:2px 7px; border-radius:6px; margin-left:6px; vertical-align:middle;
  }
  .resident-dx{font-size:12px; color:var(--muted); margin-top:2px;}
  .head-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .away-btn{
    border:1px solid var(--border); background:var(--bg); color:var(--muted);
    font-size:11px; font-weight:700; padding:7px 10px; border-radius:9px; white-space:nowrap; cursor:pointer;
  }
  .away-btn.active{background:var(--slate-dark); border-color:var(--slate-dark); color:#fff;}
  .chev-label{font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .chev{display:inline-block; transition:transform .18s ease;}
  .chev.open{transform:rotate(180deg);}

  .med-panel{
    max-height:0; overflow:hidden; transition:max-height .22s ease;
  }
  .med-panel.open{max-height:600px;}
  .med-group{margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);}
  .med-group .hosp{font-size:11.5px; font-weight:700; color:var(--slate); margin-bottom:4px;}
  .med-group ul{margin:0; padding-left:16px;}
  .med-group li{font-size:12.5px; color:var(--text); line-height:1.65;}

  .away-note{
    margin-top:14px; font-size:12px; color:var(--slate); background:var(--slate-soft);
    padding:9px 12px; border-radius:10px; font-weight:600;
  }

  .slot-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .slot-btn{
    flex:1; min-width:96px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--bg); padding:10px 8px; text-align:center; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  }
  .slot-btn .label{font-size:12px; font-weight:700; color:var(--muted);}
  .slot-btn .line{font-size:10.5px; font-weight:700; color:var(--slate-dark); display:none; line-height:1.5;}
  .slot-btn .line.confirm{color:var(--coral-deep);}
  .slot-btn .tag{font-size:9px; color:var(--muted); display:none; font-weight:700;}

  .slot-btn.pending{background:var(--amber-soft); border-color:var(--amber);}
  .slot-btn.pending .label{display:none;}
  .slot-btn.pending .line.admin{display:block;}
  .slot-btn.pending .tag{display:block; color:var(--amber);}

  .slot-btn.signed{background:var(--coral-soft); border-color:var(--coral);}
  .slot-btn.signed .label{display:none;}
  .slot-btn.signed .line{display:block;}

  .slot-btn:active{transform:scale(.97);}
  .slot-btn.stamping{animation:stampPop .32s ease;}
  @keyframes stampPop{
    0%{transform:scale(1) rotate(0deg);}
    35%{transform:scale(1.18) rotate(-6deg);}
    60%{transform:scale(.94) rotate(2deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  .slot-btn .unsign{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--slate-dark); color:#fff; font-size:11px; border:2px solid var(--surface);
    display:none; align-items:center; justify-content:center; line-height:1;
  }
  .slot-btn.has-log.admin-mode .unsign{display:flex;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--slate-dark); color:#fff; padding:11px 18px; border-radius:12px;
    font-size:13px; font-weight:600; box-shadow:0 10px 24px -6px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
    max-width:86%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .config-warning{
    margin:0 0 16px; padding:14px; background:var(--coral-soft); border:1px solid var(--coral);
    border-radius:12px; font-size:12.5px; color:var(--coral-deep); line-height:1.6;
  }

  /* ---------- 전체현황(월간) ---------- */
  .unit-block{margin-bottom:26px;}
  .unit-block h2{
    font-size:14px; font-weight:800; color:var(--slate-dark); margin:0 0 10px;
    padding-left:10px; border-left:4px solid var(--coral);
  }
  .month-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px; margin-bottom:14px;
  }
  .month-card .mc-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;}
  .month-card .mc-name{font-size:14px; font-weight:800;}
  .month-card .mc-dx{font-size:11px; color:var(--muted);}
  .month-table-wrap{overflow-x:auto;}
  .half-label{
    font-size:10.5px; font-weight:700; color:var(--slate); margin:10px 0 4px;
  }
  .half-label:first-of-type{margin-top:0;}
  table.month-table{border-collapse:collapse; width:100%; min-width:520px;}
  table.month-table th, table.month-table td{
    border:1px solid var(--border); text-align:center; font-size:8.5px; padding:3px 2px; white-space:normal;
    line-height:1.25; min-width:30px;
  }
  table.month-table thead th{background:var(--slate-soft); color:var(--slate-dark); font-weight:700; position:sticky; top:0; white-space:nowrap;}
  table.month-table tbody th{background:var(--bg); font-weight:700; color:var(--slate); min-width:44px; white-space:nowrap;}
  table.month-table td.on{background:var(--coral-soft); color:#C0392B; font-weight:800;}
  table.month-table td.on .nm-confirm{color:#1A1A1A;}
  table.month-table td.pending{background:var(--amber-soft); color:#C0392B; font-weight:800;}
  table.month-table td.pending .tag{font-size:7px; font-weight:600; opacity:.75; display:block; color:#96701F;}
  table.month-table td.away{background:var(--slate-soft); color:var(--slate); font-weight:800;}
  table.month-table td.today-col{outline:2px solid #B9C6DC; outline-offset:-2px;}
  table.month-table .nm{display:block;}

  .print-approval{display:none;}
  .legend-note{font-size:10.5px; color:#333; margin-top:6px;}

  /* ---------- 입소자관리 ---------- */
  .mgmt-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .mgmt-name{font-size:14px; font-weight:800;}
  .mgmt-dx{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .mgmt-actions{display:flex; gap:6px; flex:none;}

  .edit-panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px;}
  .edit-panel h3{margin:0 0 14px; font-size:15px; font-weight:800;}
  .f-label{display:block; font-size:11.5px; font-weight:700; color:var(--slate); margin:14px 0 6px;}
  .f-label:first-of-type{margin-top:0;}
  .field{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px;
    font-size:13.5px; font-family:inherit; color:var(--text); background:var(--bg);
  }
  textarea.field{resize:vertical; min-height:64px; line-height:1.5;}
  .chk-row{display:flex; gap:14px; flex-wrap:wrap;}
  .chk{display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600;}
  .chk input{width:16px; height:16px;}
  .med-edit-group{
    border:1px dashed var(--border); border-radius:10px; padding:10px; margin-bottom:10px; background:var(--bg);
  }
  .med-edit-row{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .med-edit-row .field{flex:1; min-width:120px;}
  .med-edit-row .icon-btn{flex:none;}
  .med-list-area{font-size:12.5px;}
  .edit-actions{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}

  /* ---------- 인쇄 ---------- */
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .print-only{display:block !important;}
    #app{max-width:none;}
    main{padding:0;}
    .topbar{position:static; border:none; padding:0 0 10px;}
    .resident-card{border:1px solid #999; box-shadow:none; break-inside:avoid; margin-bottom:8px;}
    .med-panel{max-height:none !important;}
    .chev-label{display:none;}
    .slot-btn{border:1px solid #666;}
    .slot-btn .unsign{display:none !important;}
    .summary-bar{display:none;}
    @page{ size: landscape; margin: 10mm; }
    table.month-table{font-size:13px;}
    table.month-table th, table.month-table td{padding:7px 4px; min-width:46px;}
    table.month-table td.pending .tag{font-size:8.5px;}
    .half-label{font-size:12px;}
    .unit-block h2{break-after:avoid;}
    .month-card{
      break-inside:avoid; border:1px solid #999; padding:16px;
      break-after:page; page-break-after:always;
      display:flex; flex-direction:column; min-height:178mm;
    }
    .unit-block:last-child .month-card:last-child{break-after:auto; page-break-after:auto;}
    .print-approval{
      display:flex !important; justify-content:flex-end; align-items:center; gap:22px; margin-top:auto; padding-top:20px;
    }
    .print-approval .approval-box{
      display:flex; flex-direction:row; align-items:center; gap:8px;
    }
    .print-approval .seal-slot{
      width:52px; height:40px; border:1px solid #999; border-radius:4px; flex:none;
    }
    .print-approval .role{font-size:11px; font-weight:700; color:#333; white-space:nowrap;}
    .print-header{
      display:block; margin-bottom:14px; border:1px solid #333; padding:10px 14px;
    }
    .print-header h1{font-size:18px; margin:0 0 4px;}
    .print-header .meta{font-size:12px; color:#333; display:flex; justify-content:space-between;}
    .print-sign{display:flex; gap:0; margin-top:8px; border-top:1px solid #333; padding-top:6px;}
    .print-sign div{flex:1; text-align:center; font-size:11px;}
    .print-sign div span{display:block; font-weight:700; margin-bottom:14px;}
  }
</style>
</head>

let state = {

  enteringCode: "",

  date: todayStr(),
  month: todayStr().slice(0,7),

  away: {},
  monthLogs: {},
  monthAway: {},
  openPanels: {},
  residents: [],

  unsubMonth: null,
  unsubAwayDay: null,
  unsubAwayMonth: null,
  unsubResidents: null
};

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function nowLabel(){
  const now = new Date();
  return `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
}
function escapeAttr(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove("show"), 2000);
}

/* ============================================================
   Firestore 구독
   ============================================================ */
function subscribeResidents(){
  if(state.unsubResidents || !firebaseReady) return;
  state.unsubResidents = onSnapshot(collection(db,"residents"), snap=>{
    const list = [];
    snap.forEach(d=> list.push({ id:d.id, ...d.data() }));
    list.sort((a,b)=>{
      if(a.unit !== b.unit) return a.unit < b.unit ? -1 : 1;
      return (a.name||"").localeCompare(b.name||"", "ko");
    });
    state.residents = list;
    state.residentsLoaded = true;
    render();
  }, err=>{ console.error(err); showToast("입소자 데이터를 불러오지 못했습니다."); });
}

function subscribeDate(dateStr){
  if(state.unsubDay){ state.unsubDay(); state.unsubDay = null; }
  if(state.unsubAwayDay){ state.unsubAwayDay(); state.unsubAwayDay = null; }
  if(!firebaseReady) return;

  const q = query(collection(db, "medLogs"), where("date","==",dateStr));
  state.unsubDay = onSnapshot(q, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      next[`${v.residentId}_${v.time}`] = { administer: v.administer || null, confirm: v.confirm || null };
    });
    state.logs = next;
    render();
  }, err=>{ console.error(err); showToast("데이터를 불러오지 못했습니다."); });

  const qa = query(collection(db, "residentStatus"), where("date","==",dateStr));
  state.unsubAwayDay = onSnapshot(qa, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      if(v.away) next[v.residentId] = { name:v.staffName, ts:v.ts };
    });
    state.away = next;
    render();
  }, err=>{ console.error(err); });
}

function subscribeMonth(monthStr){
  if(state.unsubMonth){ state.unsubMonth(); state.unsubMonth = null; }
  if(state.unsubAwayMonth){ state.unsubAwayMonth(); state.unsubAwayMonth = null; }
  if(!firebaseReady) return;
  const [y,m] = monthStr.split("-").map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const start = `${monthStr}-01`;
  const end = `${monthStr}-${String(lastDay).padStart(2,"0")}`;

  const q = query(collection(db, "medLogs"), where("date",">=",start), where("date","<=",end));
  state.unsubMonth = onSnapshot(q, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      const day = parseInt(v.date.slice(8,10), 10);
      next[`${v.residentId}_${day}_${v.time}`] = { administer: v.administer || null, confirm: v.confirm || null };
    });
    state.monthLogs = next;
    render();
  }, err=>{ console.error(err); showToast("데이터를 불러오지 못했습니다."); });

  const qa = query(collection(db, "residentStatus"), where("date",">=",start), where("date","<=",end));
  state.unsubAwayMonth = onSnapshot(qa, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      if(v.away){
        const day = parseInt(v.date.slice(8,10), 10);
        next[`${v.residentId}_${day}`] = { name:v.staffName };
      }
    });
    state.monthAway = next;
    render();
  }, err=>{ console.error(err); });
}

/* ============================================================
   서명 / 귀가 토글
   ============================================================ */
async function handleSlotClick(resident, time){
  if(!firebaseReady){ showToast("Firebase 설정을 먼저 완료해주세요."); return; }
  if(state.away[resident.id]) return;

  const staff = STAFF[state.staffCode];
  const key = `${resident.id}_${time}`;
  const log = state.logs[key] || {};
  const docId = `${resident.id}_${state.date}_${time}`;
  const ref = doc(db, "medLogs", docId);

  if(!log.administer){
    await setDoc(ref, {
      residentId: resident.id, residentName: resident.name, unit: resident.unit,
      date: state.date, time,
      administer: { name: staff.name, code: state.staffCode, ts: nowLabel() },
      confirm: null,
      updatedAt: serverTimestamp()
    });
    showToast(`${resident.name} · ${time} 투약자 서명 완료 (${staff.name}) — 확인자 서명 대기중`);
    return;
  }
  if(!log.confirm){
    if(log.administer.code === state.staffCode){
      showToast("투약자와 다른 담당자가 확인해야 합니다.");
      return;
    }
    await setDoc(ref, {
      confirm: { name: staff.name, code: state.staffCode, ts: nowLabel() },
      updatedAt: serverTimestamp()
    }, { merge:true });
    showToast(`${resident.name} · ${time} 확인자 서명 완료 (${staff.name})`);
    return;
  }
}

async function unsignSlot(resident, time){
  const docId = `${resident.id}_${state.date}_${time}`;
  await deleteDoc(doc(db, "medLogs", docId));
  showToast(`${resident.name} · ${time} 서명을 초기화했습니다.`);
}

async function toggleAway(resident){
  if(!firebaseReady){ showToast("Firebase 설정을 먼저 완료해주세요."); return; }
  const staff = STAFF[state.staffCode];
  const id = `${resident.id}_${state.date}`;
  const ref = doc(db, "residentStatus", id);
  if(state.away[resident.id]){
    await deleteDoc(ref);
    showToast(`${resident.name} 귀가 표시를 해제했습니다.`);
  }else{
    await setDoc(ref, {
      residentId: resident.id, unit: resident.unit, date: state.date,
      away: true, staffName: staff.name, staffCode: state.staffCode, ts: nowLabel()
    });
    showToast(`${resident.name} 귀가/외박으로 표시했습니다.`);
  }
}

function genResidentId(unit){
  const prefix = unit === "기린초2" ? "g2" : "g1";
  return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}`;
}
function emptyMedGroup(){ return { hospName:"", note:"", list:[""] }; }

async function seedResidents(){
  if(!firebaseReady){ showToast("Firebase 설정을 먼저 완료해주세요."); return; }
  showToast("초기 데이터를 불러오는 중...");
  for(const r of SEED_RESIDENTS){
    await setDoc(doc(db, "residents", r.id), {
      unit: r.unit, name: r.name, dx: r.dx, times: r.times, meds: r.meds
    });
  }
  showToast("초기 입소자 데이터를 모두 불러왔습니다.");
}

function collectFormValues(){
  if(!state.editingResident) return;
  const nameEl = document.getElementById("f_name");
  if(!nameEl) return;
  const r = state.editingResident;
  r.name = nameEl.value;
  r.unit = document.getElementById("f_unit").value;
  r.dx = document.getElementById("f_dx").value;
  r.times = Array.from(document.querySelectorAll(".chk-row input:checked")).map(c=>c.value);
  const groups = [];
  document.querySelectorAll(".med-edit-group").forEach(g=>{
    const hospName = g.querySelector('[data-field="hospName"]').value;
    const note = g.querySelector('[data-field="note"]').value;
    const list = g.querySelector('[data-field="list"]').value
      .split("\n").map(s=>s.trim()).filter(Boolean);
    groups.push({ hospName, note, list });
  });
  r.meds = groups;
}

async function saveResident(){
  collectFormValues();
  const r = state.editingResident;
  if(!r.name || !r.name.trim()){ showToast("이름을 입력해주세요."); return; }
  if(!firebaseReady){ showToast("Firebase 설정을 먼저 완료해주세요."); return; }
  const id = r.id || genResidentId(r.unit);
  await setDoc(doc(db, "residents", id), {
    unit: r.unit, name: r.name.trim(), dx: r.dx || "",
    times: r.times && r.times.length ? r.times : ["아침"],
    meds: (r.meds || []).filter(g => g.hospName || (g.list && g.list.length))
  });
  showToast(`${r.name} 정보를 저장했습니다.`);
  state.editingResident = null;
  render();
}

async function deleteResident(id, name){
  if(!confirm(`${name} 입소자 정보를 삭제할까요? 관련 투약 기록은 남아있지만 목록에서 사라집니다.`)) return;
  await deleteDoc(doc(db, "residents", id));
  showToast(`${name} 입소자를 삭제했습니다.`);
  state.editingResident = null;
  render();
}

function render(){

    renderLogin();
  }else{
    renderApp();
  }
}

function renderLogin(){
  const dotsHtml = Array.from({length:4}).map((_,i)=>
    `<span class="${i < state.enteringCode.length ? 'filled':''}"></span>`).join("");
  app.innerHTML = `
    <div class="login-screen">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z" fill="#ffffff"/><path d="M9 12l2 2 4-4" stroke="#46587A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>투약일지</h1>
        <p>사하의집 · 담당자 인증</p>
      </div>
      <div class="code-dots ${state.loginError ? 'err':''}">${dotsHtml}</div>
      <div class="login-msg">${state.loginError || "&nbsp;"}</div>
      <div class="keypad" id="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button class="ghost" data-k="clear">지우기</button>
        <button data-k="0">0</button>
        <button class="ghost" data-k="back">←</button>
      </div>
    </div>
  `;
  document.getElementById("keypad").addEventListener("click", e=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    const k = btn.dataset.k;
    if(k === "clear"){ state.enteringCode = ""; state.loginError=""; }
    else if(k === "back"){ state.enteringCode = state.enteringCode.slice(0,-1); }
    else{
      if(state.enteringCode.length < 4) state.enteringCode += k;
    }
    if(state.enteringCode.length === 4){
      if(STAFF[state.enteringCode]){
        state.staffCode = state.enteringCode;
        sessionStorage.setItem("medlog_code", state.staffCode);
        state.enteringCode = "";
        state.loginError = "";
        subscribeResidents();
        subscribeDate(state.date);
      }else{
        state.loginError = "등록되지 않은 번호입니다.";
        setTimeout(()=>{ state.enteringCode=""; render(); }, 500);
      }
    }
    render();
  });
}

function renderDayHtml(unit, isAdmin){
  if(!state.residentsLoaded){
    return `<div class="empty">입소자 데이터를 불러오는 중...</div>`;
  }
  const list = state.residents.filter(r => r.unit === unit);
  let done = 0, total = 0, awayCount = 0;
  list.forEach(r=>{
    if(state.away[r.id]){ awayCount++; return; }
    (r.times||[]).forEach(t=>{ total++; const log = state.logs[`${r.id}_${t}`]; if(log && log.administer && log.confirm) done++; });
  });

  const summary = `
    <div class="summary-bar no-print">
      <div class="summary-chip"><div class="n">${done}/${total}</div><div class="l">이중서명 완료</div></div>
      <div class="summary-chip"><div class="n">${list.length}</div><div class="l">${unit} 인원</div></div>
      <div class="summary-chip"><div class="n">${awayCount}</div><div class="l">귀가/외박</div></div>
    </div>`;

  const cards = list.length === 0
    ? `<div class="empty">등록된 입소자가 없습니다. 관리자는 "입소자관리" 탭에서 추가할 수 있어요.</div>`
    : list.map(r => residentCardHtml(r, isAdmin)).join("");

  return summary + cards;
}

function residentCardHtml(r, isAdmin){
  const open = !!state.openPanels[r.id];
  const away = state.away[r.id];
  const medGroups = (r.meds||[]).map(g => {
    const hospDisp = g.note ? `${g.hospName} · ${g.note}` : (g.hospName || "");
    return `
    <div class="med-group">
      <div class="hosp">${escapeHtml(hospDisp)}</div>
      <ul>${(g.list||[]).map(m=>`<li>${escapeHtml(m)}</li>`).join("")}</ul>
    </div>`;
  }).join("");

  const slots = SLOT_ORDER.filter(t => (r.times||[]).includes(t)).map(t=>{
    const log = state.logs[`${r.id}_${t}`] || {};
    const hasLog = !!log.administer;
    const confirmed = hasLog && !!log.confirm;
    const cls = confirmed ? "signed" : (hasLog ? "pending" : "");
    return `
      <button class="slot-btn ${cls} ${hasLog?'has-log':''} ${isAdmin?'admin-mode':''}" data-rid="${r.id}" data-time="${t}">
        <span class="label">${t}</span>
        <span class="tag">${t} · 확인 대기</span>
        <span class="line admin">${hasLog ? `투약 ${escapeHtml(log.administer.name)} ${log.administer.ts}` : ""}</span>
        <span class="line confirm">${confirmed ? `확인 ${escapeHtml(log.confirm.name)} ${log.confirm.ts}` : ""}</span>
        ${hasLog ? `<span class="unsign" data-rid="${r.id}" data-time="${t}">×</span>` : ""}
      </button>`;
  }).join("");

  return `
    <div class="resident-card ${away?'away':''}">
      <div class="resident-head" data-id="${r.id}">
        <div>
          <div class="resident-name">${escapeHtml(r.name)}${away ? `<span class="away-badge">귀가/외박</span>`:""}</div>
          <div class="resident-dx">${escapeHtml(r.dx||"")}</div>
        </div>
        <div class="head-actions">
          <button class="away-btn no-print ${away?'active':''}" data-away="${r.id}">${away ? "귀가 해제" : "귀가/외박"}</button>
          <div class="chev-label no-print" data-toggle="${r.id}">약정보 <span class="chev ${open?'open':''}">▾</span></div>
        </div>
      </div>
      <div class="med-panel ${open?'open':''}">${medGroups}</div>
      ${away
        ? `<div class="away-note">🏠 귀가/외박으로 표시됨 (${escapeHtml(away.name)} · ${away.ts}) — 오늘 투약 없음</div>`
        : `<div class="slot-row">${slots}</div>`}
    </div>
  `;
}

function cellHtml(r, d, t, todayD){
  const awayInfo = state.monthAway[`${r.id}_${d}`];
  const log = state.monthLogs[`${r.id}_${d}_${t}`];
  let cls = "", content = "", title = `${d}일 ${t}`;
  if(awayInfo){
    cls = "away"; content = `<span class="nm">귀가</span>`; title += ` · 귀가/외박 (${awayInfo.name})`;
  }else if(log && log.administer && log.confirm){
    cls = "on";
    content = `<span class="nm">${escapeHtml(log.administer.name)}</span><span class="nm nm-confirm">${escapeHtml(log.confirm.name)}</span>`;
    title += ` · 투약 ${log.administer.name} ${log.administer.ts} / 확인 ${log.confirm.name} ${log.confirm.ts}`;
  }else if(log && log.administer){
    cls = "pending";
    content = `<span class="nm">${escapeHtml(log.administer.name)}</span><span class="tag">확인대기</span>`;
    title += ` · 투약 ${log.administer.name} ${log.administer.ts} (확인 대기)`;
  }else{
    title += " · 미서명";
  }
  const todayCls = d===todayD ? "today-col" : "";
  return `<td class="${cls} ${todayCls}" title="${title}">${content}</td>`;
}

function halfTableHtml(r, days, todayD, label){
  const rows = (r.times||[]).map(t=>{
    const cells = days.map(d=> cellHtml(r, d, t, todayD)).join("");
    return `<tr><th>${t}</th>${cells}</tr>`;
  }).join("");
  return `
    <div class="half-label">${label}</div>
    <div class="month-table-wrap">
      <table class="month-table">
        <thead><tr><th>구분</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderMonthHtml(){
  if(!state.residentsLoaded){
    return `<div class="empty">입소자 데이터를 불러오는 중...</div>`;
  }
  const [y,m] = state.month.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayD = (state.month === todayStr().slice(0,7)) ? Number(todayStr().slice(8,10)) : -1;
  const allDays = Array.from({length:daysInMonth}, (_,i)=> i+1);
  const firstHalf = allDays.filter(d=> d<=15);
  const secondHalf = allDays.filter(d=> d>15);

  return UNITS.map(unit=>{
    const list = state.residents.filter(r=>r.unit===unit);
    const cards = list.map(r=>{
      return `
        <div class="month-card">
          <div class="mc-head"><span class="mc-name">${escapeHtml(r.name)}</span><span class="mc-dx">${escapeHtml(r.dx||"")}</span></div>
          ${halfTableHtml(r, firstHalf, todayD, `1 ~ 15일`)}
          ${halfTableHtml(r, secondHalf, todayD, `16 ~ ${daysInMonth}일`)}
          <div class="legend-note print-only">※ 붉은색 : 투약자, 검은색 : 확인자</div>
          <div class="print-approval print-only">
            <div class="approval-box">
              <div class="role">확인자(팀장)</div>
              <div class="seal-slot"></div>
            </div>
            <div class="approval-box">
              <div class="role">확인자(간호사)</div>
              <div class="seal-slot"></div>
            </div>
          </div>
        </div>`;
    }).join("");
    return `<div class="unit-block"><h2>${unit}</h2>${cards || '<div class="empty">등록된 입소자가 없습니다.</div>'}</div>`;
  }).join("");
}

/* ---------- 입소자관리 화면 ---------- */
function renderManagementHtml(){
  if(!state.residentsLoaded){
    return `<div class="empty">입소자 데이터를 불러오는 중...</div>`;
  }
  if(state.editingResident){
    return residentEditFormHtml(state.editingResident);
  }
  if(state.residents.length === 0){
    return `
      <div class="empty">아직 등록된 입소자가 없습니다.</div>
      <button class="icon-btn primary" id="seedBtn" style="display:block; margin:0 auto 14px;">초기 입소자 데이터 불러오기 (최초 1회)</button>
      <button class="icon-btn" id="addResidentBtn" style="display:block; margin:0 auto;">+ 새 입소자 직접 추가</button>
    `;
  }
  const addBtn = `<button class="icon-btn primary" id="addResidentBtn" style="margin-bottom:14px;">+ 새 입소자 추가</button>`;
  const groups = UNITS.map(unit=>{
    const list = state.residents.filter(r=>r.unit===unit);
    const rows = list.map(r=>`
      <div class="mgmt-row">
        <div><div class="mgmt-name">${escapeHtml(r.name)}</div><div class="mgmt-dx">${escapeHtml(r.dx||"")}</div></div>
        <div class="mgmt-actions">
          <button class="icon-btn" data-edit="${r.id}">수정</button>
          <button class="icon-btn" data-del="${r.id}" style="color:var(--coral-deep);">삭제</button>
        </div>
      </div>`).join("");
    return `<div class="unit-block"><h2>${unit}</h2>${rows || '<div class="empty">입소자 없음</div>'}</div>`;
  }).join("");
  return addBtn + groups;
}

function residentEditFormHtml(r){
  const isNew = !r.id;
  const meds = (r.meds && r.meds.length) ? r.meds : [emptyMedGroup()];
  const medGroupsHtml = meds.map((g, gi)=>`
    <div class="med-edit-group" data-gi="${gi}">
      <div class="med-edit-row">
        <input type="text" class="field" data-field="hospName" placeholder="병원명 (예: 제천병원)" value="${escapeAttr(g.hospName||"")}">
        <input type="text" class="field" data-field="note" placeholder="진단/사유 (선택, 예: 행동조절)" value="${escapeAttr(g.note||"")}">
        <button class="icon-btn" data-delgroup="${gi}">그룹삭제</button>
      </div>
      <textarea class="field med-list-area" data-field="list" placeholder="약품명 용량 용법 — 한 줄에 하나씩 입력 (예: 폭세틴캡슐 20mg 1-0-0)" rows="3">${escapeHtml((g.list||[]).join("\n"))}</textarea>
    </div>
  `).join("");

  const timeChecks = SLOT_ORDER.map(t=>`
    <label class="chk"><input type="checkbox" value="${t}" ${ (r.times||[]).includes(t) ? "checked":"" }> ${t}</label>
  `).join("");

  return `
    <div class="edit-panel">
      <h3>${isNew ? "새 입소자 추가":"입소자 수정 · " + escapeHtml(r.name||"")}</h3>

      <label class="f-label">이름</label>
      <input type="text" class="field" id="f_name" value="${escapeAttr(r.name||"")}" placeholder="입소자 이름">

      <label class="f-label">소속</label>
      <select class="field" id="f_unit">
        ${UNITS.map(u=>`<option value="${u}" ${r.unit===u?"selected":""}>${u}</option>`).join("")}
      </select>

      <label class="f-label">진단 요약 (카드에 작게 표시돼요)</label>
      <input type="text" class="field" id="f_dx" value="${escapeAttr(r.dx||"")}" placeholder="예: 행동조절 · 뇌전증 · 변비">

      <label class="f-label">투약 시간대</label>
      <div class="chk-row">${timeChecks}</div>

      <label class="f-label">투약 그룹 (병원별로 묶어서 입력, · 나 | 는 직접 입력하지 않아도 자동으로 붙어요)</label>
      <div id="medGroups">${medGroupsHtml}</div>
      <button class="icon-btn" id="addGroupBtn">+ 병원 그룹 추가</button>

      <div class="edit-actions">
        <button class="icon-btn primary" id="saveResidentBtn">저장</button>
        <button class="icon-btn" id="cancelEditBtn">취소</button>
        ${!isNew ? `<button class="icon-btn" id="deleteResidentBtn" style="color:var(--coral-deep);">삭제</button>` : ""}
      </div>
    </div>
  `;
}

function bindCommonEvents(isAdmin, isMonth, isManage){
  document.getElementById("logoutBtn").onclick = ()=>{
    sessionStorage.removeItem("medlog_code");
    state.staffCode = null;
    [state.unsubDay, state.unsubMonth, state.unsubAwayDay, state.unsubAwayMonth, state.unsubResidents].forEach(u=>{ if(u) u(); });
    state.unsubDay = state.unsubMonth = state.unsubAwayDay = state.unsubAwayMonth = state.unsubResidents = null;
    render();
  };
  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.onclick = ()=> window.print();

  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{
      state.activeTab = t.dataset.tab;
      state.editingResident = null;
      if(state.activeTab === "전체현황"){
        if(state.unsubDay){ state.unsubDay(); state.unsubDay=null; }
        if(state.unsubAwayDay){ state.unsubAwayDay(); state.unsubAwayDay=null; }
        subscribeMonth(state.month);
      }else if(state.activeTab === "입소자관리"){
        if(state.unsubDay){ state.unsubDay(); state.unsubDay=null; }
        if(state.unsubAwayDay){ state.unsubAwayDay(); state.unsubAwayDay=null; }
        if(state.unsubMonth){ state.unsubMonth(); state.unsubMonth=null; }
        if(state.unsubAwayMonth){ state.unsubAwayMonth(); state.unsubAwayMonth=null; }
      }else{
        if(state.unsubMonth){ state.unsubMonth(); state.unsubMonth=null; }
        if(state.unsubAwayMonth){ state.unsubAwayMonth(); state.unsubAwayMonth=null; }
        subscribeDate(state.date);
      }
      render();
    };
  });

  if(isManage){
    const seedBtn = document.getElementById("seedBtn");
    if(seedBtn) seedBtn.onclick = ()=> seedResidents();

    const addBtn = document.getElementById("addResidentBtn");
    if(addBtn) addBtn.onclick = ()=>{
      state.editingResident = { unit:"기린초1", name:"", dx:"", times:["아침"], meds:[emptyMedGroup()] };
      render();
    };
    document.querySelectorAll("[data-edit]").forEach(b=>{
      b.onclick = ()=>{
        const found = state.residents.find(r=>r.id===b.dataset.edit);
        state.editingResident = JSON.parse(JSON.stringify(found));
        render();
      };
    });
    document.querySelectorAll("[data-del]").forEach(b=>{
      b.onclick = ()=>{
        const found = state.residents.find(r=>r.id===b.dataset.del);
        if(found) deleteResident(found.id, found.name);
      };
    });

    if(state.editingResident){
      const addGroupBtn = document.getElementById("addGroupBtn");
      if(addGroupBtn) addGroupBtn.onclick = ()=>{
        collectFormValues();
        state.editingResident.meds.push(emptyMedGroup());
        render();
      };
      document.querySelectorAll("[data-delgroup]").forEach(b=>{
        b.onclick = ()=>{
          collectFormValues();
          const gi = Number(b.dataset.delgroup);
          state.editingResident.meds.splice(gi,1);
          if(state.editingResident.meds.length === 0) state.editingResident.meds.push(emptyMedGroup());
          render();
        };
      });
      const saveBtn = document.getElementById("saveResidentBtn");
      if(saveBtn) saveBtn.onclick = ()=> saveResident();
      const cancelBtn = document.getElementById("cancelEditBtn");
      if(cancelBtn) cancelBtn.onclick = ()=>{ state.editingResident = null; render(); };
      const delBtn = document.getElementById("deleteResidentBtn");
      if(delBtn) delBtn.onclick = ()=> deleteResident(state.editingResident.id, state.editingResident.name);
    }
    return;
  }

  if(isMonth){
    document.getElementById("monthInput").onchange = e=>{
      state.month = e.target.value;
      subscribeMonth(state.month);
      render();
    };
    document.getElementById("prevMonth").onclick = ()=> shiftMonth(-1);
    document.getElementById("nextMonth").onclick = ()=> shiftMonth(1);
  }else{
    document.getElementById("dateInput").onchange = e=>{
      state.date = e.target.value;
      subscribeDate(state.date);
      render();
    };
    document.getElementById("prevDay").onclick = ()=> shiftDate(-1);
    document.getElementById("nextDay").onclick = ()=> shiftDate(1);

    document.querySelectorAll(".chev-label").forEach(h=>{
      h.onclick = ()=>{
        const id = h.dataset.toggle;
        state.openPanels[id] = !state.openPanels[id];
        render();
      };
    });
    document.querySelectorAll(".away-btn").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const resident = state.residents.find(r=>r.id===b.dataset.away);
        toggleAway(resident);
      };
    });
    document.querySelectorAll(".slot-btn").forEach(b=>{
      b.onclick = (e)=>{
        if(e.target.classList.contains("unsign")) return;
        const rid = b.dataset.rid, time = b.dataset.time;
        const resident = state.residents.find(r=>r.id===rid);
        b.classList.add("stamping");
        handleSlotClick(resident, time);
      };
    });
    document.querySelectorAll(".unsign").forEach(u=>{
      u.onclick = (e)=>{
        e.stopPropagation();
        if(!isAdmin) return;
        const rid = u.dataset.rid, time = u.dataset.time;
        const resident = state.residents.find(r=>r.id===rid);
        unsignSlot(resident, time);
      };
    });
  }
}

function shiftDate(delta){
  const d = new Date(state.date + "T00:00:00");
  d.setDate(d.getDate() + delta);
  const p = n => String(n).padStart(2,"0");
  state.date = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  subscribeDate(state.date);
  render();
}
function shiftMonth(delta){
  const [y,m] = state.month.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  const p = n => String(n).padStart(2,"0");
  state.month = `${d.getFullYear()}-${p(d.getMonth()+1)}`;
  subscribeMonth(state.month);
  render();
}

render();
if(state.staffCode){
  subscribeResidents();
  if(state.activeTab === "전체현황"){ subscribeMonth(state.month); }
  else if(state.activeTab !== "입소자관리"){ subscribeDate(state.date); }
}
</script>
</body>
</html>
