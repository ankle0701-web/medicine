<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>투약일지 · 사하의집</title>
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --slate:#46587A;
    --slate-dark:#2B3A54;
    --slate-soft:#EEF1F6;
    --coral:#E8785A;
    --coral-soft:#FBE9E3;
    --coral-deep:#C85A3D;
    --amber:#D9A441;
    --amber-soft:#FBF1DD;
    --text:#25303F;
    --muted:#8992A3;
    --border:#E3E7EE;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  button{font-family:inherit; -webkit-tap-highlight-color:transparent;}
  #app{max-width:820px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  .print-only{display:none;}

  /* ---------- 로그인 화면 ---------- */
  .login-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; gap:28px;
  }
  .brand{text-align:center;}
  .brand .mark{
    width:56px; height:56px; border-radius:16px; background:var(--slate);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
    box-shadow:0 8px 20px -8px rgba(43,58,84,.45);
  }
  .brand .mark svg{width:28px; height:28px;}
  .brand h1{font-size:20px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em;}
  .brand p{font-size:13px; color:var(--muted); margin:0;}

  .code-dots{display:flex; gap:12px; justify-content:center; height:16px;}
  .code-dots span{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--border); background:transparent;
    transition:all .15s ease;
  }
  .code-dots span.filled{background:var(--slate); border-color:var(--slate); transform:scale(1.05);}
  .code-dots.err span.filled{background:var(--coral); border-color:var(--coral);}

  .keypad{display:grid; grid-template-columns:repeat(3,72px); gap:14px;}
  .keypad button{
    width:72px; height:72px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); font-size:22px; font-weight:600; color:var(--text);
    box-shadow:0 2px 6px rgba(43,58,84,.06);
  }
  .keypad button:active{background:var(--slate-soft); transform:scale(.96);}
  .keypad button.ghost{border:none; box-shadow:none; background:transparent; color:var(--muted); font-size:14px;}
  .login-msg{font-size:13px; color:var(--coral-deep); min-height:18px; font-weight:600;}

  /* ---------- 상단바 ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:14px 18px;
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .topbar-left{display:flex; flex-direction:column;}
  .topbar-left .facility{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.02em;}
  .topbar-left .who{font-size:15px; font-weight:700; margin-top:1px;}
  .topbar-left .who .role{
    font-size:10px; font-weight:700; color:var(--coral-deep); background:var(--coral-soft);
    padding:2px 6px; border-radius:6px; margin-left:6px; vertical-align:middle;
  }
  .topbar-actions{display:flex; gap:6px;}
  .icon-btn{
    border:none; background:var(--slate-soft); color:var(--slate); font-size:12px; font-weight:600;
    padding:8px 12px; border-radius:10px; white-space:nowrap;
  }
  .icon-btn.primary{background:var(--slate); color:#fff;}

  .date-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .date-row input[type=date],.date-row input[type=month],.date-row select{
    flex:1; border:1px solid var(--border); border-radius:10px; padding:9px 10px;
    font-size:14px; font-family:inherit; color:var(--text); background:var(--bg);
  }
  .date-nav{
    border:1px solid var(--border); background:var(--surface); width:36px; height:36px; border-radius:10px;
    font-size:16px; color:var(--slate); font-weight:700; flex:none;
  }
  .date-nav:active{background:var(--slate-soft);}

  .tabs{display:flex; gap:8px; margin-top:12px;}
  .tab{
    flex:1; text-align:center; padding:10px 0; border-radius:10px; font-size:13px; font-weight:700;
    background:var(--bg); color:var(--muted); border:1px solid var(--border);
  }
  .tab.active{background:var(--slate); color:#fff; border-color:var(--slate);}

  /* ---------- 본문 ---------- */
  main{flex:1; padding:16px 16px 40px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:40px 20px;}

  .summary-bar{
    display:flex; gap:10px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;
  }
  .summary-chip{
    flex:none; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; min-width:84px; text-align:center;
  }
  .summary-chip .n{font-size:18px; font-weight:800; color:var(--slate-dark); line-height:1;}
  .summary-chip .l{font-size:10px; color:var(--muted); margin-top:4px; font-weight:600;}

  .resident-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .resident-card.away{background:var(--bg);}
  .resident-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .resident-name{font-size:16px; font-weight:800; letter-spacing:-.01em;}
  .away-badge{
    font-size:10px; font-weight:700; color:var(--slate); background:var(--slate-soft);
    padding:2px 7px; border-radius:6px; margin-left:6px; vertical-align:middle;
  }
  .resident-dx{font-size:12px; color:var(--muted); margin-top:2px;}
  .head-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .away-btn{
    border:1px solid var(--border); background:var(--bg); color:var(--muted);
    font-size:11px; font-weight:700; padding:7px 10px; border-radius:9px; white-space:nowrap;
  }
  .away-btn.active{background:var(--slate-dark); border-color:var(--slate-dark); color:#fff;}
  .chev-label{font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .chev{display:inline-block; transition:transform .18s ease;}
  .chev.open{transform:rotate(180deg);}

  .med-panel{
    max-height:0; overflow:hidden; transition:max-height .22s ease;
  }
  .med-panel.open{max-height:600px;}
  .med-group{margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);}
  .med-group .hosp{font-size:11.5px; font-weight:700; color:var(--slate); margin-bottom:4px;}
  .med-group ul{margin:0; padding-left:16px;}
  .med-group li{font-size:12.5px; color:var(--text); line-height:1.65;}
  .temp-med-badge{
    display:inline-block; margin-top:4px; margin-right:4px; padding:3px 7px; border-radius:7px;
    background:var(--amber-soft); color:#96701F; font-size:10.5px; font-weight:800;
  }

  .away-note{
    margin-top:14px; font-size:12px; color:var(--slate); background:var(--slate-soft);
    padding:9px 12px; border-radius:10px; font-weight:600;
  }

  .slot-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .slot-row.hidden{display:none;}
  .slot-btn{
    flex:1; min-width:96px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--bg); padding:10px 8px; text-align:center; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .slot-btn .label{font-size:12px; font-weight:700; color:var(--muted);}
  .slot-btn .med-label{font-size:10px; font-weight:800; color:var(--slate-dark); line-height:1.25;}
  .slot-btn .line{font-size:10.5px; font-weight:700; color:var(--slate-dark); display:none; line-height:1.5;}
  .slot-btn .line.confirm{color:var(--coral-deep);}
  .slot-btn .tag{font-size:9px; color:var(--muted); display:none; font-weight:700;}

  .slot-btn.pending{background:var(--amber-soft); border-color:var(--amber);}
  .slot-btn.pending .label{display:none;}
  .slot-btn.pending .med-label{display:none;}
  .slot-btn.pending .line.admin{display:block;}
  .slot-btn.pending .tag{display:block; color:var(--amber);}

  .slot-btn.signed{background:var(--coral-soft); border-color:var(--coral);}
  .slot-btn.signed .label{display:none;}
  .slot-btn.signed .med-label{display:none;}
  .slot-btn.signed .line{display:block;}

  .slot-btn:active{transform:scale(.97);}
  .slot-btn.stamping{animation:stampPop .32s ease;}
  @keyframes stampPop{
    0%{transform:scale(1) rotate(0deg);}
    35%{transform:scale(1.18) rotate(-6deg);}
    60%{transform:scale(.94) rotate(2deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  .slot-btn .unsign{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--slate-dark); color:#fff; font-size:11px; border:2px solid var(--surface);
    display:none; align-items:center; justify-content:center; line-height:1;
  }
  .slot-btn.has-log.admin-mode .unsign{display:flex;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--slate-dark); color:#fff; padding:11px 18px; border-radius:12px;
    font-size:13px; font-weight:600; box-shadow:0 10px 24px -6px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
    max-width:86%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .config-warning{
    margin:0 0 16px; padding:14px; background:var(--coral-soft); border:1px solid var(--coral);
    border-radius:12px; font-size:12.5px; color:var(--coral-deep); line-height:1.6;
  }

  /* ---------- 입소자 관리 ---------- */
  .admin-panel{display:flex; flex-direction:column; gap:14px;}
  .admin-section{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px;
  }
  .admin-section h2{font-size:14px; margin:0 0 10px; color:var(--slate-dark);}
  .admin-form{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .admin-form label{display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; color:var(--muted);}
  .admin-form input,.admin-form select,.admin-form textarea{
    border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text);
    padding:9px 10px; font-family:inherit; font-size:13px; width:100%;
  }
  .admin-form textarea{min-height:78px; resize:vertical;}
  .admin-form .wide{grid-column:1/-1;}
  .time-checks{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .time-check{display:flex !important; flex-direction:row !important; align-items:center; gap:6px !important;}
  .time-check input{width:auto;}
  .admin-list{display:flex; flex-direction:column; gap:10px;}
  .admin-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:10px;
  }
  .admin-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .admin-title{font-size:14px; font-weight:800;}
  .admin-meta{font-size:11px; color:var(--muted); margin-top:2px;}
  .admin-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .small-btn{
    border:1px solid var(--border); background:var(--bg); color:var(--slate);
    border-radius:9px; padding:7px 9px; font-size:11px; font-weight:700;
  }
  .small-btn.danger{color:var(--coral-deep); background:var(--coral-soft); border-color:var(--coral-soft);}
  .med-edit{display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center;}
  .med-edit span{font-size:12px; line-height:1.5;}
  .routine-med-form{display:grid; grid-template-columns:1fr 1.4fr auto auto; gap:6px; align-items:center;}
  .routine-med-form input{
    border:1px solid var(--border); border-radius:9px; background:var(--bg); color:var(--text);
    padding:8px 9px; font-family:inherit; font-size:12px; width:100%;
  }
  .temp-med-edit{
    border:1px dashed var(--border); border-radius:10px; padding:10px; margin-top:10px;
    background:var(--bg);
  }
  .temp-med-edit .admin-meta{
    font-size:12px; font-weight:800; color:var(--slate-dark); margin:0 0 8px;
  }
  .admin-empty{font-size:13px; color:var(--muted); text-align:center; padding:20px;}
  @media (max-width:560px){
    .admin-form{grid-template-columns:1fr;}
    .admin-form .wide{grid-column:auto;}
    .routine-med-form{grid-template-columns:1fr;}
  }

  /* ---------- 전체현황(월간) ---------- */
  .unit-block{margin-bottom:26px;}
  .unit-block h2{
    font-size:14px; font-weight:800; color:var(--slate-dark); margin:0 0 10px;
    padding-left:10px; border-left:4px solid var(--coral);
  }
  .month-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px; margin-bottom:14px;
  }
  .month-card .mc-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;}
  .month-card .mc-name{font-size:14px; font-weight:800;}
  .month-card .mc-dx{font-size:11px; color:var(--muted);}
  .month-table-wrap{overflow-x:auto;}
  .half-label{
    font-size:10.5px; font-weight:700; color:var(--slate); margin:10px 0 4px;
  }
  .half-label:first-of-type{margin-top:0;}
  table.month-table{border-collapse:collapse; width:100%; min-width:420px;}
  table.month-table th, table.month-table td{
    border:1px solid var(--border); text-align:center; font-size:8.5px; padding:3px 2px; white-space:normal;
    line-height:1.25; min-width:30px;
  }
  table.month-table thead th{background:var(--slate-soft); color:var(--slate-dark); font-weight:700; position:sticky; top:0; white-space:nowrap;}
  table.month-table tbody th{background:var(--bg); font-weight:700; color:var(--slate); min-width:44px; white-space:nowrap;}
  table.month-table td.on{background:var(--coral-soft); color:#C0392B; font-weight:800;}
  table.month-table td.on .nm-confirm{color:#1A1A1A;}
  table.month-table td.pending{background:var(--amber-soft); color:#C0392B; font-weight:800;}
  table.month-table td.pending .tag{font-size:7px; font-weight:600; opacity:.75; display:block; color:#96701F;}
  table.month-table td.away{background:var(--slate-soft); color:var(--slate); font-weight:800;}
  table.month-table td.today-col{outline:2px solid #B9C6DC; outline-offset:-2px;}
  table.month-table .nm{display:block;}
  .print-med-list{
    display:none; font-size:10.5px; line-height:1.45; color:#222; border:1px solid #999;
    padding:7px 9px; margin:8px 0 10px;
  }
  .print-med-list b{display:block; margin-bottom:3px;}

  .print-approval{display:none;}
  .legend-note{font-size:10.5px; color:#333; margin-top:6px;}

  /* ---------- 인쇄 ---------- */
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .print-only{display:block !important;}
    #app{max-width:none;}
    main{padding:0;}
    .topbar{position:static; border:none; padding:0 0 10px;}
    .resident-card{border:1px solid #999; box-shadow:none; break-inside:avoid; margin-bottom:8px;}
    .med-panel{max-height:none !important;}
    .chev-label{display:none;}
    .slot-btn{border:1px solid #666;}
    .slot-btn .unsign{display:none !important;}
    .summary-bar{display:none;}
    @page{ size: landscape; margin: 10mm; }
    table.month-table{font-size:11px;}
    table.month-table th, table.month-table td{padding:5px 4px; min-width:48px;}
    .half-label{font-size:11px; margin:7px 0 3px;}
    table.month-table td.pending .tag{font-size:7.5px;}
    .unit-block h2{break-after:avoid;}
    .month-card{
      break-inside:avoid; border:1px solid #999; padding:12px;
      break-after:page; page-break-after:always;
      display:flex; flex-direction:column; min-height:178mm;
    }
    .unit-block:last-child .month-card:last-child{break-after:auto; page-break-after:auto;}
    .print-approval{
      display:flex !important; justify-content:flex-end; align-items:center; gap:22px; margin-top:auto; padding-top:20px;
    }
    .print-approval .approval-box{
      display:flex; flex-direction:row; align-items:center; gap:8px;
    }
    .print-approval .seal-slot{
      width:52px; height:40px; border:1px solid #999; border-radius:4px; flex:none;
    }
    .print-approval .role{font-size:11px; font-weight:700; color:#333; white-space:nowrap;}
    .print-header{
      display:block; margin-bottom:14px; border:1px solid #333; padding:10px 14px;
    }
    .print-med-list{display:block !important; font-size:9.5px; padding:5px 7px; margin:5px 0 7px;}
    .print-med-list ul{margin:0; padding-left:16px;}
    .print-header h1{font-size:18px; margin:0 0 4px;}
    .print-header .meta{font-size:12px; color:#333; display:flex; justify-content:space-between;}
    .print-sign{display:flex; gap:0; margin-top:8px; border-top:1px solid #333; padding-top:6px;}
    .print-sign div{flex:1; text-align:center; font-size:11px;}
    .print-sign div span{display:block; font-weight:700; margin-bottom:14px;}
  }
</style>
</head>

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function nowLabel(){
  const now = new Date();
  return `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
}

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove("show"), 2000);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const ADMIN_EMAILS = ["ankle0701@gmail.com"];
function isAdminEmail(email){
  return ADMIN_EMAILS.includes(String(email || "").trim().toLowerCase());
}
function isAdmin(){ return state.userProfile?.role === "admin" || isAdminEmail(state.currentUser?.email); }
function isEmailLogin(){ return !!state.currentUser?.email && !state.currentUser?.isAnonymous; }
function canOpenAdminMenu(){ return isAdmin() || isEmailLogin(); }

  return {
    uid: state.currentUser?.uid || null,
    name: state.userProfile?.name || state.currentUser?.email || "unknown",
    email: state.currentUser?.email || ""
  };
}
function normalizeResident(v, id){
  return {
    id,
    unit: v.unit || UNITS[0],
    name: v.name || "",
    dx: v.dx || "",
    times: Array.isArray(v.times) ? v.times.filter(Boolean) : [],
    meds: Array.isArray(v.meds) ? v.meds.map(g=>({
      hosp: g.hosp || "약",
      list: Array.isArray(g.list) ? g.list.filter(Boolean) : []
    })) : [],
    tempMeds: Array.isArray(v.tempMeds) ? v.tempMeds.map(m=>({
      id: m.id || `temp_${Date.now()}`,
      name: m.name || "추가약",
      note: m.note || "",
      startDate: m.startDate || todayStr(),
      endDate: m.endDate || m.startDate || todayStr(),
      times: Array.isArray(m.times) ? m.times.filter(Boolean) : []
    })) : [],
    sortOrder: Number.isFinite(v.sortOrder) ? v.sortOrder : 999,
    hidden: !!v.hidden
  };
}
function defaultResidents(){
  return DEFAULT_RESIDENTS.map((r, idx) => normalizeResident({...r, sortOrder: idx}, r.id));
}
function mergeResidents(remoteResidents){
  const merged = new Map(defaultResidents().map(r => [r.id, r]));
  remoteResidents.forEach(r => {
    if(r.hidden) merged.delete(r.id);
    else merged.set(r.id, r);
  });
  return Array.from(merged.values()).sort((a,b)=>
    (UNITS.indexOf(a.unit) - UNITS.indexOf(b.unit)) ||
    (a.sortOrder - b.sortOrder) ||
    a.name.localeCompare(b.name, "ko")
  );
}
function getResidents(unit){
  return state.residents.filter(r => !unit || r.unit === unit);
}
function findResident(id){
  return state.residents.find(r => r.id === id);
}
function dateInRange(dateStr, startDate, endDate){
  return dateStr >= startDate && dateStr <= endDate;
}
function tempMedsForDate(resident, dateStr){
  return (resident.tempMeds || []).filter(m => dateInRange(dateStr, m.startDate, m.endDate));
}
function tempMedsForMonth(resident, monthStr){
  const [y,m] = monthStr.split("-").map(Number);
  const end = `${monthStr}-${String(new Date(y, m, 0).getDate()).padStart(2,"0")}`;
  const start = `${monthStr}-01`;
  return (resident.tempMeds || []).filter(m => m.startDate <= end && m.endDate >= start);
}
function tempSlotKey(tempMed, time){
  return `추가약:${tempMed.id}:${time}`;
}
function tempSlotTitle(tempMed, time){
  return `${tempMed.name} · ${time}`;
}
function logKeyFor(residentId, time){
  return `${residentId}_${time}`;
}
function medicationSnapshot(resident, medInfo){
  const version = resident.medicationVersion || resident.updatedAt?.seconds || "unversioned";
  if(medInfo?.type === "temporary"){
    const temp = (resident.tempMeds || []).find(m => m.id === medInfo.tempMedId) || null;
    return {
      medicationVersion: version,
      routineMeds: null,
      temporaryMed: temp ? cloneData(temp) : { id: medInfo.tempMedId, name: medInfo.name }
    };
  }
  return {
    medicationVersion: version,
    routineMeds: cloneData(resident.meds || []),
    temporaryMed: null
  };
}
function normalizeStaff(v){
  return { name: v.name || "", email: v.email || "", role: v.role === "admin" ? "admin" : "staff" };
}
function normalizeRole(value){
  return String(value || "").trim().replace(/^["']|["']$/g, "");
}

  if(!firebaseReady){ showToast("Firebase 설정을 먼저 완료해주세요."); return; }

    state.loginError = "4자리 번호를 입력해주세요.";
    render();
    return;
  }
  try{
    const cred = auth.currentUser?.isAnonymous ? { user: auth.currentUser } : await signInAnonymously(auth);
    const snap = await getDoc(staffDocRef(code));
    if(!snap.exists()){
      state.loginError = "등록되지 않은 번호입니다.";
      state.enteringCode = "";
      render();
      return;
    }
    const data = snap.data();
    state.currentUser = cred.user;
    state.userProfile = {
      uid: cred.user.uid,
      name: data.name || "직원",
      email: "",
      role: "staff",
      staffCode: code
    };
    sessionStorage.setItem("staff_code_profile", JSON.stringify(state.userProfile));
    state.enteringCode = "";
    state.loginError = "";
    subscribeStaff();
    subscribeResidents();
    subscribeDate(state.date);
    render();
  }catch(err){
    console.error(err);
    state.loginError = "직원 번호 로그인을 할 수 없습니다.";
    render();
  }
}

function medRowsFromText(text){
  return String(text || "")
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean);
}
function medsToText(meds){
  return (meds || []).flatMap(g => (g.list || []).map(m => `${g.hosp} | ${m}`)).join("\n");
}
function textToMeds(text){
  const groups = [];
  medRowsFromText(text).forEach(row=>{
    const [hospRaw, ...medParts] = row.split("|");
    const hosp = medParts.length ? hospRaw.trim() : "약";
    const med = (medParts.length ? medParts.join("|") : hospRaw).trim();
    let group = groups.find(g => g.hosp === hosp);
    if(!group){ group = { hosp, list: [] }; groups.push(group); }
    group.list.push(med);
  });
  return groups;
}

function addMedToGroups(meds, hosp, med){

  if(!group){ group = { hosp, list: [] }; next.push(group); }
  group.list.push(med);
  return next;
}

function subscribeDate(dateStr){
  if(state.unsubDay){ state.unsubDay(); state.unsubDay = null; }
  if(state.unsubAwayDay){ state.unsubAwayDay(); state.unsubAwayDay = null; }
  if(!firebaseReady) return;

  const q = query(collection(db, "medLogs"), where("date","==",dateStr));
  state.unsubDay = onSnapshot(q, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      next[logKeyFor(v.residentId, v.time)] = {
        administer: v.administer || null,
        confirm: v.confirm || null,
        medName: v.medName || "",
        medType: v.medType || "routine"
      };
    });
    state.logs = next;
    render();
  }, err=>{ console.error(err); showToast("데이터를 불러오지 못했습니다."); });

  const qa = query(collection(db, "residentStatus"), where("date","==",dateStr));
  state.unsubAwayDay = onSnapshot(qa, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      if(v.away) next[v.residentId] = { name:v.staffName, ts:v.ts };
    });
    state.away = next;
    render();
  }, err=>{ console.error(err); });
}

function subscribeMonth(monthStr){
  if(state.unsubMonth){ state.unsubMonth(); state.unsubMonth = null; }
  if(state.unsubAwayMonth){ state.unsubAwayMonth(); state.unsubAwayMonth = null; }
  if(!firebaseReady) return;
  const [y,m] = monthStr.split("-").map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const start = `${monthStr}-01`;
  const end = `${monthStr}-${String(lastDay).padStart(2,"0")}`;

  const q = query(collection(db, "medLogs"), where("date",">=",start), where("date","<=",end));
  state.unsubMonth = onSnapshot(q, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      const day = parseInt(v.date.slice(8,10), 10);
      next[`${v.residentId}_${day}_${v.time}`] = {
        administer: v.administer || null,
        confirm: v.confirm || null,
        medName: v.medName || "",
        medType: v.medType || "routine"
      };
    });
    state.monthLogs = next;
    render();
  }, err=>{ console.error(err); showToast("데이터를 불러오지 못했습니다."); });

  const qa = query(collection(db, "residentStatus"), where("date",">=",start), where("date","<=",end));
  state.unsubAwayMonth = onSnapshot(qa, snap=>{
    const next = {};
    snap.forEach(d=>{
      const v = d.data();
      if(v.away){
        const day = parseInt(v.date.slice(8,10), 10);
        next[`${v.residentId}_${day}`] = { name:v.staffName };
      }
    });
    state.monthAway = next;
    render();
  }, err=>{ console.error(err); });
}

async function handleSlotClick(resident, time, medInfo=null){
  if(!firebaseReady){ showToast("Firebase 설정을 먼저 완료해주세요."); return; }
  if(!resident){ showToast("입소자 정보를 찾을 수 없습니다."); return; }
  if(state.away[resident.id]) return;

  const staff = actorInfo();
  const key = logKeyFor(resident.id, time);
  const log = state.logs[key] || {};
  const docId = `${resident.id}_${state.date}_${time}`;
  const ref = doc(db, "medLogs", docId);
  const medName = medInfo?.name || "정규약";
  const medType = medInfo?.type || "routine";
  const medSnapshot = medicationSnapshot(resident, medInfo);

  if(!log.administer){
    await setDoc(ref, {
      residentId: resident.id, residentName: resident.name, unit: resident.unit,
      diagnosis: resident.dx || "",
      date: state.date, time, medName, medType,
      tempMedId: medInfo?.tempMedId || null,
      ...medSnapshot,
      administer: { name: staff.name, uid: staff.uid, email: staff.email, ts: nowLabel() },
      confirm: null,
      updatedAt: serverTimestamp()
    });
    showToast(`${resident.name} · ${medName} · ${time} 투약자 서명 완료 (${staff.name}) — 확인자 서명 대기중`);
    return;
  }
  if(!log.confirm){
    if(log.administer.uid === state.currentUser?.uid){
      showToast("투약자와 다른 담당자가 확인해야 합니다.");
      return;
    }
    await setDoc(ref, {
      confirm: { name: staff.name, uid: staff.uid, email: staff.email, ts: nowLabel() },
      updatedAt: serverTimestamp()
    }, { merge:true });
    showToast(`${resident.name} · ${medName} · ${time} 확인자 서명 완료 (${staff.name})`);
    return;
  }
  // 이미 투약자·확인자 모두 서명됨 — 추가 동작 없음 (관리자는 × 로 초기화)
}

function renderLogin(){
  const dotsHtml = Array.from({length:4}).map((_,i)=>
    `<span class="${i < state.enteringCode.length ? 'filled':''}"></span>`).join("");
  app.innerHTML = `
    <div class="login-screen">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z" fill="#ffffff"/><path d="M9 12l2 2 4-4" stroke="#46587A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>투약일지</h1>
        <p>사하의집 · 담당자 인증</p>
      </div>

        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button class="ghost" data-k="clear">지우기</button>
        <button data-k="0">0</button>

      </div>

        <label class="wide">비밀번호<input type="password" name="password" required autocomplete="current-password"></label>
        <button class="icon-btn primary wide" type="submit">관리자 로그인</button>
      </form>
    </div>
  `;
  document.getElementById("keypad").addEventListener("click", e=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    const k = btn.dataset.k;
    if(k === "clear"){ state.enteringCode = ""; state.loginError=""; }
    else if(k === "back"){ state.enteringCode = state.enteringCode.slice(0,-1); }
    else if(state.enteringCode.length < 4){ state.enteringCode += k; }
    if(state.enteringCode.length === 4){
      loginWithStaffCode(state.enteringCode);
      return;
    }
    render();
  });
  document.getElementById("loginForm").onsubmit = async e=>{
    e.preventDefault();
    const form = e.currentTarget;
    state.loginEmail = form.elements.email.value.trim();
    state.loginError = "";
    try{
      sessionStorage.removeItem("staff_code_profile");
      await signInWithEmailAndPassword(auth, state.loginEmail, form.elements.password.value);
    }catch(err){
      console.error(err);
      state.loginError = "이메일 또는 비밀번호를 확인해주세요.";
      render();
    }
  };
}

function renderApp(){
  const staff = state.userProfile;
  const admin = isAdmin();

function renderDayHtml(unit, isAdmin){
  const list = getResidents(unit);
  let done = 0, total = 0, awayCount = 0;
  list.forEach(r=>{
    if(state.away[r.id]){ awayCount++; return; }
    r.times.forEach(t=>{ total++; const log = state.logs[logKeyFor(r.id, t)]; if(log && log.administer && log.confirm) done++; });
    tempMedsForDate(r, state.date).forEach(m=>{
      m.times.forEach(t=>{
        total++;
        const log = state.logs[logKeyFor(r.id, tempSlotKey(m, t))];
        if(log && log.administer && log.confirm) done++;
      });
    });
  });

  const summary = `
    <div class="summary-bar no-print">
      <div class="summary-chip"><div class="n">${done}/${total}</div><div class="l">이중서명 완료</div></div>
      <div class="summary-chip"><div class="n">${list.length}</div><div class="l">${unit} 인원</div></div>
      <div class="summary-chip"><div class="n">${awayCount}</div><div class="l">귀가/외박</div></div>
    </div>`;

  const cards = state.residentsLoading
    ? `<div class="empty">입소자 정보를 불러오는 중입니다.</div>`
    : list.length === 0
    ? `<div class="empty">등록된 입소자가 없습니다.</div>`
    : list.map(r => residentCardHtml(r, isAdmin)).join("");

  return summary + cards;
}

function cellHtml(r, d, row, todayD){
  if(row.active && !row.active(d)) return `<td class="${d===todayD ? "today-col" : ""}"></td>`;
  const awayInfo = state.monthAway[`${r.id}_${d}`];
  const log = state.monthLogs[`${r.id}_${d}_${row.key}`];
  let cls = "", content = "", title = `${d}일 ${row.label}`;
  if(awayInfo){
    cls = "away"; content = `<span class="nm">귀가</span>`; title += ` · 귀가/외박 (${awayInfo.name})`;
  }else if(log && log.administer && log.confirm){
    cls = "on";
    content = `<span class="nm">${escapeHtml(log.administer.name)}</span><span class="nm nm-confirm">${escapeHtml(log.confirm.name)}</span>`;
    title += ` · 투약 ${escapeHtml(log.administer.name)} ${escapeHtml(log.administer.ts)} / 확인 ${escapeHtml(log.confirm.name)} ${escapeHtml(log.confirm.ts)}`;
  }else if(log && log.administer){
    cls = "pending";
    content = `<span class="nm">${escapeHtml(log.administer.name)}</span><span class="tag">확인대기</span>`;
    title += ` · 투약 ${escapeHtml(log.administer.name)} ${escapeHtml(log.administer.ts)} (확인 대기)`;
  }else{
    title += " · 미서명";
  }
  const todayCls = d===todayD ? "today-col" : "";
  return `<td class="${cls} ${todayCls}" title="${title}">${content}</td>`;
}

        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
function monthWeekChunks(monthStr){
  const [y,m] = monthStr.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const chunks = [];
  let start = 1;
  const firstDow = new Date(y, m-1, 1).getDay();
  const firstEnd = Math.min(daysInMonth, firstDow === 0 ? 1 : 8 - firstDow);
  chunks.push(Array.from({length:firstEnd}, (_,i)=> i+1));
  start = firstEnd + 1;
  while(start <= daysInMonth){
    const end = Math.min(daysInMonth, start + 6);
    chunks.push(Array.from({length:end-start+1}, (_,i)=> start+i));
    start = end + 1;
  }
  return chunks;
}
function currentMonthWeek(){
  const weeks = monthWeekChunks(state.month);
  const idx = Math.max(0, Math.min(weeks.length - 1, Number(state.monthWeek || 1) - 1));
  state.monthWeek = String(idx + 1);
  return { idx, days: weeks[idx], weeks };
}
function monthWeekOptionsHtml(){
  const weeks = monthWeekChunks(state.month);
  if(Number(state.monthWeek) > weeks.length) state.monthWeek = String(weeks.length);
  return weeks.map((days, idx)=>
    `<option value="${idx+1}" ${state.monthWeek===String(idx+1) ? "selected" : ""}>${idx+1}주차 (${days[0]}~${days[days.length-1]}일)</option>`
  ).join("");
}
function monthRows(r){
  const rows = r.times.map(t => ({ key:t, label:t }));
  tempMedsForMonth(r, state.month).forEach(m=>{
    m.times.forEach(t=>{
      rows.push({
        key: tempSlotKey(m, t),
        label: `${m.name} ${t}`,
        active: d => dateInRange(`${state.month}-${String(d).padStart(2,"0")}`, m.startDate, m.endDate)
      });
    });
  });
  return rows;
}

            <div class="med-edit">
              <span>${escapeHtml(m.name)} · ${escapeHtml(m.startDate)}~${escapeHtml(m.endDate)} · ${m.times.map(escapeHtml).join(", ")}${m.note ? ` · ${escapeHtml(m.note)}` : ""}</span>
              <button class="small-btn danger" data-delete-temp-med="${escapeHtml(r.id)}" data-temp-med-id="${escapeHtml(m.id)}">처방약 삭제</button>
            </div>
          `).join("") || `<div class="admin-empty">등록된 처방약이 없습니다.</div>`}
        </div>
      </div>`;
  }).join("") : `<div class="admin-empty">등록된 입소자가 없습니다.</div>`;

  return `
    <div class="admin-panel">
      <section class="admin-section">
        <h2>담당자 추가</h2>
        ${staffFormHtml()}
      </section>
      <section class="admin-section">
        <h2>담당자 목록</h2>
        <div class="admin-list">${staffHtml || `<div class="admin-empty">등록된 담당자가 없습니다.</div>`}</div>
      </section>
      <section class="admin-section">
        <h2>입소자 추가</h2>
        ${residentFormHtml()}
      </section>
      <section class="admin-section">
        <h2>입소자 목록</h2>
        <div class="admin-list">${listHtml}</div>
      </section>
    </div>`;
}

function bindCommonEvents(isAdmin, isMonth, isAdminPage){
  document.getElementById("logoutBtn").onclick = ()=>{
    sessionStorage.removeItem("staff_code_profile");
    signOut(auth);
    [state.unsubDay, state.unsubMonth, state.unsubAwayDay, state.unsubAwayMonth, state.unsubResidents].forEach(u=>{ if(u) u(); });
    state.unsubDay = state.unsubMonth = state.unsubAwayDay = state.unsubAwayMonth = state.unsubResidents = null;
  };
  document.getElementById("printBtn").onclick = ()=> window.print();

  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{
      state.activeTab = t.dataset.tab;
      if(state.activeTab === "입소자 관리"){
        if(state.unsubDay){ state.unsubDay(); state.unsubDay=null; }
        if(state.unsubAwayDay){ state.unsubAwayDay(); state.unsubAwayDay=null; }
        if(state.unsubMonth){ state.unsubMonth(); state.unsubMonth=null; }
        if(state.unsubAwayMonth){ state.unsubAwayMonth(); state.unsubAwayMonth=null; }
      }else if(state.activeTab === "전체현황"){
        if(state.unsubDay){ state.unsubDay(); state.unsubDay=null; }
        if(state.unsubAwayDay){ state.unsubAwayDay(); state.unsubAwayDay=null; }
        subscribeMonth(state.month);
      }else{
        if(state.unsubMonth){ state.unsubMonth(); state.unsubMonth=null; }
        if(state.unsubAwayMonth){ state.unsubAwayMonth(); state.unsubAwayMonth=null; }
        subscribeDate(state.date);
      }
      render();
    };
  });

  if(isAdminPage){
    const refreshAdminRoleBtn = document.getElementById("refreshAdminRoleBtn");
    if(refreshAdminRoleBtn){
      refreshAdminRoleBtn.onclick = async ()=>{
        state.userProfile = await loadUserProfile(state.currentUser);
        if(isAdmin()){
          showToast("관리자 권한이 확인되었습니다.");
          subscribeStaff();
          subscribeResidents();
        }else{
          showToast("아직 관리자 권한을 확인하지 못했습니다.");
        }
        render();
      };
    }
    document.querySelectorAll(".add-resident-form,.edit-resident-form").forEach(form=>{
      form.onsubmit = async e=>{
        e.preventDefault();
        await saveResidentFromForm(form, form.dataset.rid || null);
      };
    });
    document.querySelectorAll(".add-staff-form,.edit-staff-form").forEach(form=>{
      form.onsubmit = async e=>{
        e.preventDefault();
        await saveStaffFromForm(form, form.dataset.code || null);
      };
    });
    document.querySelectorAll(".add-temp-med-form").forEach(form=>{
      form.onsubmit = async e=>{
        e.preventDefault();
        await saveTempMedFromForm(form, form.dataset.rid);
      };
    });
    document.querySelectorAll(".add-routine-med-form").forEach(form=>{
      form.onsubmit = async e=>{
        e.preventDefault();
        await addRoutineMedFromForm(form, form.dataset.rid);
      };
    });
    document.querySelectorAll(".edit-routine-med-form").forEach(form=>{
      form.onsubmit = async e=>{
        e.preventDefault();
        await updateRoutineMedFromForm(form, form.dataset.rid);
      };
    });
    document.querySelectorAll("[data-delete-resident]").forEach(btn=>{
      btn.onclick = ()=> deleteResident(btn.dataset.deleteResident);
    });
    document.querySelectorAll("[data-delete-staff]").forEach(btn=>{
      btn.onclick = ()=> deleteStaff(btn.dataset.deleteStaff);
    });
    document.querySelectorAll("[data-delete-med]").forEach(btn=>{
      btn.onclick = ()=> deleteMed(btn.dataset.deleteMed, btn.dataset.hosp, btn.dataset.med);
    });
    document.querySelectorAll("[data-delete-temp-med]").forEach(btn=>{
      btn.onclick = ()=> deleteTempMed(btn.dataset.deleteTempMed, btn.dataset.tempMedId);
    });
    return;
  }

  if(isMonth){
    document.getElementById("monthInput").onchange = e=>{
      state.month = e.target.value;
      state.monthWeek = "1";
      subscribeMonth(state.month);
      render();
    };
    document.getElementById("weekInput").onchange = e=>{
      state.monthWeek = e.target.value;
      render();
    };
    document.getElementById("prevMonth").onclick = ()=> shiftMonth(-1);
    document.getElementById("nextMonth").onclick = ()=> shiftMonth(1);
  }else{
    document.getElementById("dateInput").onchange = e=>{
      state.date = e.target.value;
      subscribeDate(state.date);
      render();
    };
    document.getElementById("prevDay").onclick = ()=> shiftDate(-1);
    document.getElementById("nextDay").onclick = ()=> shiftDate(1);

    document.querySelectorAll(".chev-label").forEach(h=>{
      h.onclick = ()=>{
        const id = h.dataset.toggle;
        state.openPanels[id] = !state.openPanels[id];
        render();
      };
    });
    document.querySelectorAll(".away-btn").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const resident = findResident(b.dataset.away);
        toggleAway(resident);
      };
    });
    document.querySelectorAll(".slot-btn").forEach(b=>{
      b.onclick = (e)=>{
        if(e.target.classList.contains("unsign")) return;
        const rid = b.dataset.rid, time = b.dataset.time;
        const resident = findResident(rid);
        b.classList.add("stamping");
        handleSlotClick(resident, time, {
          name: b.dataset.medName || "정규약",
          type: b.dataset.medType || "routine",
          tempMedId: b.dataset.tempMedId || null
        });
      };
    });
    document.querySelectorAll(".unsign").forEach(u=>{
      u.onclick = (e)=>{
        e.stopPropagation();
        if(!isAdmin) return;
        const rid = u.dataset.rid, time = u.dataset.time;
        const resident = findResident(rid);
        unsignSlot(resident, time);
      };
    });
  }
}

function shiftDate(delta){
  const d = new Date(state.date + "T00:00:00");
  d.setDate(d.getDate() + delta);
  const p = n => String(n).padStart(2,"0");
  state.date = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  subscribeDate(state.date);
  render();
}
function shiftMonth(delta){
  const [y,m] = state.month.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  const p = n => String(n).padStart(2,"0");
  state.month = `${d.getFullYear()}-${p(d.getMonth()+1)}`;
  state.monthWeek = "1";
  subscribeMonth(state.month);
  render();
}

if(firebaseReady && auth){
  onAuthStateChanged(auth, async user=>{
    try{
      [state.unsubDay, state.unsubMonth, state.unsubAwayDay, state.unsubAwayMonth, state.unsubResidents, state.unsubStaff].forEach(u=>{ if(u) u(); });
      state.unsubDay = state.unsubMonth = state.unsubAwayDay = state.unsubAwayMonth = state.unsubResidents = state.unsubStaff = null;
      state.currentUser = user;
      if(user?.isAnonymous){
        try{
          state.userProfile = JSON.parse(sessionStorage.getItem("staff_code_profile") || "null");
        }catch(_){ state.userProfile = null; }
      }else{
        state.userProfile = user ? await loadUserProfile(user) : null;
      }
      state.authReady = true;
      if(user && state.userProfile){
        subscribeStaff();
        subscribeResidents();
        if(state.activeTab === "전체현황"){ subscribeMonth(state.month); }
        else if(state.activeTab !== "입소자 관리"){ subscribeDate(state.date); }
      }
    }catch(err){
      console.error(err);
      state.currentUser = null;
      state.userProfile = null;
      state.authReady = true;
    }
    render();
  });
}else{
  state.authReady = true;
  render();
}
render();
</script>
</body>
</html>
